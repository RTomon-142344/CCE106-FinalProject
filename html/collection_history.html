<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection History | Rean Ramz Lending Corp</title>
    <link rel="stylesheet" href="../css/collection_history.css">
    <link rel="stylesheet" href="../css/loading.css">
    <link rel="stylesheet" href="../css/filters.css">
    <link rel="icon" href="../assets/logo-dark.png">
</head>
<body>
<header>
  <nav class="nav-bar">
    <div class="nav-left">
      <a href="../php/{{HOME_PAGE}}">
        <img class="logo" src="../assets/logo-light.png" alt="Rean Ramz Lending Corp">
      </a>
    </div>
    <div class="nav-right">
      <div id="themeToggle" class="theme-toggle"></div>
      <a class="home-btn" href="../php/{{HOME_PAGE}}">
        <span>HOME</span>
      </a>
    </div>
  </nav>
</header>

    <!-- Main Content Container -->
    <div class="serno">
        <div class="page-header">
            <div class="header-top">
                <div class="title-search-wrapper">
                    <div>
                        <h2>COLLECTION HISTORY</h2>
                    </div>
                    <div class="search-container">
                        <div class="search-box">
                            <input class="search" type="text" id="search" placeholder="Search customers...">
                        </div>
                        <div class="date-filter">
                            <label for="paymentDateFilter">Collection date:</label>
                            <input type="date" id="paymentDateFilter">
                        </div>
                    </div>
                </div>
                <!-- Refresh Button -->
                <div class="refresh-button-wrapper">
                    <button id="refreshBtn" class="refresh-btn-minimalist" title="Refresh collection history">
                        Refresh
                    </button>
                </div>
            </div>
        </div>

        <!-- Collection History Container -->
        <div class="collection-container">
            <div id="loadingMessage" class="loading-message">Loading collection history...</div>
            <div id="noCollectionsMessage" class="no-collections-message" style="display: none;">
                No collection records found.
            </div>
            <div id="collectionTableContainer" class="collection-table-wrapper" style="display: none;">
                <table id="collectionTable" class="collection-table">
                <thead>
                    <tr>
                        <th>Customer Name</th>
                        <th>Date of loan</th>
                        <th>Principal</th>
                        <th>Interest</th>
                        <th>Paid Today</th>
                        <th>Payment Status</th>
                    </tr>
                </thead>
                    <tbody id="collectionTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/collection_history.js"></script>
    <script src="../js/loading.js"></script>
    <script src="../js/dark_light_mode.js"></script>
</body>
</html>
